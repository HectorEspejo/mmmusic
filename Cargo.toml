[package]
name = "mmmusic"
version = "0.1.0"
edition = "2024"
description = "Reproductor de música para terminal (TUI) para Omarchy"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
directories = "6"
image = "0.25"
libmpv2 = "6"
lofty = "0.25"
lru = "0.18"
md5 = "0.8.1"
mpris-server = "0.10"
notify = "8"
pipewire = { version = "0.10", features = ["v0_3_44"] }
rand = "0.10"
realfft = "3.5"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = "3.4.1"
walkdir = "2"
dns-lookup = "4.0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
