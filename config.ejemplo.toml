# Configuración de ejemplo de mmmusic.
# Copia este fichero a ~/.config/mmmusic/config.toml y ajusta lo que necesites.
# Si no existe, mmmusic lo crea automáticamente con estos valores.

[biblioteca]
# Carpetas que se indexan (se expanden ~ y variables de entorno).
# Puedes indicar varias raíces.
carpetas = ["~/Music"]
# Lanza un escaneo incremental al arrancar sin bloquear la interfaz.
escanear_al_arrancar = true
# Carpeta donde se exportan y desde la que se resuelven las playlists M3U8.
carpeta_playlists = "~/Music/Playlists"

[reproductor]
# Volumen inicial (0-100); después manda el último volumen guardado.
volumen_inicial = 80
# Saltos de , / . (segundos).
salto_corto_s = 5
# Saltos de < / > (segundos).
salto_largo_s = 30

[interfaz]
# false desactiva por completo el renderizado de carátulas.
caratulas = true
# "nerd" usa iconos Nerd Font; "ascii" usa texto.
iconos = "nerd"
# Ancho de la barra lateral en columnas (entre 14 y 40).
ancho_sidebar = 18

[tema]
# "omarchy" lee ~/.config/omarchy/current/theme/alacritty.toml.
# "terminal" usa la paleta ANSI del emulador.
fuente = "omarchy"
# Nombres de color ANSI del tema para el acento y el progreso.
acento = "blue"
progreso = "green"

[scrobbling]
# Activa el envío de escuchas a ListenBrainz (requiere token en credenciales.toml).
listenbrainz = false
# Activa el envío de escuchas y favoritas a Last.fm (requiere autorizar-lastfm).
lastfm = false
# Envía "now playing" al cargar una pista elegible.
now_playing = true

[visuales]
# Activa las visuales reactivas y el mini espectro (requiere PipeWire).
# false elimina el hilo de captura, el mini espectro y la sección 7 Visual.
activo = true
# Fotogramas por segundo del modo visual y del mini espectro (15-60).
fps = 30
# Visual inicial: espectro, barras y ondas, ambiente, partículas,
# caleidoscopio o túnel.
predeterminada = "espectro"
# Paleta inicial: "tema" (Omarchy) o "caratula" (colores dominantes de la carátula).
paleta = "tema"
# Mini espectro de 12 barras en la barra inferior (se oculta en modo compacto).
mini_espectro = true
# Minutos de inactividad antes de entrar en el modo visual como protector
# de pantalla (0 = desactivado).
autoinicio_min = 0
# Nombre del nodo de PipeWire a capturar (application.name/node.name).
nodo = "mmmusic"

[radio]
# Activa el directorio Radio Browser (pestaña Buscar y hilo de red propio).
# false deja la pestaña Buscar limitada a las emisoras locales.
directorio = true
# Descarga y cachea los logos de las emisoras guardadas (image/*, ≤ 512 KB).
logos = true
# Segundos de espera antes de dar por fallida la conexión a un stream (5-120).
espera_conexion_s = 15

[ecualizador]
# "si" activa el ecualizador al arrancar, "no" lo deja apagado y "recordar"
# usa el último estado guardado.
activo_al_arrancar = "recordar"
# Limitador a −1 dBFS dentro de la cadena (alternarlo reconstruye el audio).
limitador = true
# ReplayGain inicial: "no", "pista" o "album"; después se recuerda.
replaygain = "no"
# Preamp de ReplayGain en dB (−12..12).
replaygain_preamp_db = 0.0

[letras]
# Carpeta adicional para "<artista> - <titulo>.lrc|.txt" (normalizado).
carpeta = "~/.local/share/mmmusic/letras"
# Superponer letras sincronizadas al entrar en el modo visual (9 lo alterna).
superpuestas = false
# Líneas visibles de la superposición (1-5; la actual queda centrada).
tamano_superposicion = 3
